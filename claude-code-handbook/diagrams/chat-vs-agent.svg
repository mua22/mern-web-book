<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chat assistant versus coding agent"><title>Chat assistant versus coding agent</title><desc>A chat assistant returns text you paste yourself; an agent acts directly in your project</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="16" y="14" width="350" height="312" rx="16" fill="var(--cu-faint)" stroke="var(--cu-faint)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="16" y="14" width="350" height="312" rx="16" fill="none" stroke="var(--cu-faint)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="30" y="34" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-faint)" opacity="1">CHAT ASSISTANT</text><rect x="110" y="52" width="160" height="44" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="190.0" y="78.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">You ask a question</text><path d="M190,96 L190,126" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="110" y="126" width="160" height="44" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="190.0" y="152.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Model answers in text</text><path d="M190,170 L190,200" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="110" y="200" width="160" height="52" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="190.0" y="221.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">You copy-paste</text><text x="190.0" y="240.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">and run it yourself</text><path d="M190,252 L190,280" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="110" y="280" width="160" height="34" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="190.0" y="301.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Your code</text><rect x="394" y="14" width="350" height="312" rx="16" fill="var(--cu-teal)" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="394" y="14" width="350" height="312" rx="16" fill="none" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="408" y="34" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-teal)" opacity="1">CODING AGENT</text><rect x="430" y="52" width="150" height="44" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="505.0" y="78.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">You state a goal</text><path d="M505,96 L505,126" fill="none" stroke="var(--cu-teal)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-teal)"/><rect x="430" y="126" width="150" height="60" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="505.0" y="151.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Agent plans</text><text x="505.0" y="170.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">and takes actions</text><path d="M505,186 L505,226" fill="none" stroke="var(--cu-teal)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-teal)"/><rect x="430" y="226" width="150" height="60" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="505.0" y="251.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Change in your repo</text><text x="505.0" y="270.15000000000003" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">tested and diffable</text><rect x="630" y="114" width="82" height="24" rx="12.0" fill="var(--cu-teal)" fill-opacity="0.14" stroke="var(--cu-teal)" stroke-width="1"/><text x="671.0" y="130.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Files</text><rect x="630" y="148" width="82" height="24" rx="12.0" fill="var(--cu-teal)" fill-opacity="0.14" stroke="var(--cu-teal)" stroke-width="1"/><text x="671.0" y="164.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Shell</text><rect x="630" y="182" width="82" height="24" rx="12.0" fill="var(--cu-teal)" fill-opacity="0.14" stroke="var(--cu-teal)" stroke-width="1"/><text x="671.0" y="198.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Git</text><rect x="630" y="216" width="82" height="24" rx="12.0" fill="var(--cu-teal)" fill-opacity="0.14" stroke="var(--cu-teal)" stroke-width="1"/><text x="671.0" y="232.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Tests</text><line x1="580" y1="156" x2="626" y2="156" stroke="var(--cu-teal)" stroke-width="1.4"/><line x1="626" y1="126" x2="626" y2="228" stroke="var(--cu-teal)" stroke-width="1.4"/></svg>
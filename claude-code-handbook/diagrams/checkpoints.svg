<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Checkpoints and rewinding"><title>Checkpoints and rewinding</title><desc>Claude Code saves checkpoints automatically; git commits make permanent ones</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><line x1="40" y1="110" x2="720" y2="110" stroke="var(--cu-border-soft)" stroke-width="3"/><circle cx="80" cy="110" r="11" fill="var(--cu-bg)" stroke="var(--cu-faint)" stroke-width="3"/><text x="80" y="90" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">start</text><circle cx="230" cy="110" r="11" fill="var(--cu-bg)" stroke="var(--cu-teal)" stroke-width="3"/><text x="230" y="90" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">prompt 1</text><circle cx="380" cy="110" r="11" fill="var(--cu-bg)" stroke="var(--cu-teal)" stroke-width="3"/><text x="380" y="90" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">prompt 2</text><circle cx="530" cy="110" r="11" fill="var(--cu-bg)" stroke="var(--cu-orange)" stroke-width="3"/><text x="530" y="90" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">prompt 3</text><circle cx="680" cy="110" r="11" fill="var(--cu-bg)" stroke="#E5484D" stroke-width="3"/><text x="680" y="90" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">now</text><path d="M680,130 L680,170 L380,170 L380,128" fill="none" stroke="var(--cu-orange)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-orange)" stroke-dasharray="6 4"/><text x="530" y="190" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">rewind</text><rect x="330" y="205" width="100" height="24" rx="12.0" fill="var(--cu-teal)" fill-opacity="0.14" stroke="var(--cu-teal)" stroke-width="1"/><text x="380.0" y="221.025" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">code + chat</text><text x="40" y="40" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-muted)" opacity="1">Rewind restores code, conversation, or both — it cannot undo what happened outside your files.</text><rect x="500" y="205" width="220" height="40" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="610.0" y="229.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">git commit = permanent safety</text></svg>
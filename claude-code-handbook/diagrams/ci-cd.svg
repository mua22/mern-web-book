<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CI/CD pipeline"><title>CI/CD pipeline</title><desc>Push triggers tests, image build, deploy and a smoke test</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="16" y="70" width="126" height="64" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="79.0" y="106.55" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">git push</text><rect x="164" y="70" width="126" height="64" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="227.0" y="97.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">CI</text><text x="227.0" y="115.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">install, test</text><path d="M144,102 L162,102" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="312" y="70" width="126" height="64" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="375.0" y="97.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Build</text><text x="375.0" y="115.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">Docker image</text><path d="M292,102 L310,102" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="460" y="70" width="126" height="64" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="523.0" y="97.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Deploy</text><text x="523.0" y="115.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">to platform</text><path d="M440,102 L458,102" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="608" y="70" width="126" height="64" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="671.0" y="97.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Smoke test</text><text x="671.0" y="115.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">GET /health</text><path d="M588,102 L606,102" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M227,134 L227,190" fill="none" stroke="#E5484D" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-red)" stroke-dasharray="5 4"/><text x="300" y="168" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">red test = stop</text><rect x="16" y="190" width="728" height="76" rx="16" fill="#E5484D" stroke="#E5484D" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="16" y="190" width="728" height="76" rx="16" fill="none" stroke="#E5484D" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="30" y="210" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#E5484D" opacity="1">FAIL FAST</text><text x="380" y="226" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="var(--cu-text)" opacity="1">A red test stops the pipeline before anything reaches users.</text><text x="380" y="248" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="var(--cu-muted)" opacity="1">Secrets live in the platform&#x27;s settings, never in git.</text></svg>
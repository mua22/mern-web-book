<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What fills the context window"><title>What fills the context window</title><desc>System prompt, tools, memory, skills and the conversation share one fixed token budget</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="30" y="70" width="35.0" height="52" fill="var(--cu-faint)" fill-opacity="0.22" stroke="var(--cu-faint)" stroke-width="1.4"/><rect x="65.0" y="70" width="56.0" height="52" fill="var(--cu-purple)" fill-opacity="0.22" stroke="var(--cu-purple)" stroke-width="1.4"/><rect x="121.0" y="70" width="28.0" height="52" fill="var(--cu-teal)" fill-opacity="0.22" stroke="var(--cu-teal)" stroke-width="1.4"/><rect x="149.0" y="70" width="28.0" height="52" fill="var(--cu-orange)" fill-opacity="0.22" stroke="var(--cu-orange)" stroke-width="1.4"/><rect x="177.0" y="70" width="322.0" height="52" fill="var(--cu-teal)" fill-opacity="0.22" stroke="var(--cu-teal)" stroke-width="1.4"/><text x="338.0" y="101" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Conversation + files + results</text><rect x="499.0" y="70" width="231.0" height="52" rx="0" fill="none" stroke="var(--cu-border-soft)" stroke-width="1.5" stroke-dasharray="4 4" opacity="1"/><text x="614.5" y="101" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-muted)" opacity="1">Free space</text><rect x="30" y="70" width="700" height="52" rx="6" fill="none" stroke="var(--cu-border-soft)" stroke-width="1.8" opacity="1"/><text x="47.5" y="58" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="var(--cu-muted)" opacity="1">System</text><text x="93.0" y="36" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="var(--cu-muted)" opacity="1">Tools</text><line x1="93.0" y1="40" x2="93.0" y2="70" stroke="var(--cu-faint)" stroke-width="1"/><text x="135.0" y="58" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="var(--cu-muted)" opacity="1">CLAUDE.md</text><text x="163.0" y="36" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="var(--cu-muted)" opacity="1">Skills</text><line x1="163.0" y1="40" x2="163.0" y2="70" stroke="var(--cu-faint)" stroke-width="1"/><text x="30" y="150" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-faint)" opacity="1">0 tokens</text><text x="730" y="150" text-anchor="end" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-faint)" opacity="1">≈ 200,000 tokens</text><text x="380" y="25" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="500" fill="var(--cu-faint)" opacity="1">Illustrative proportions — run /context to see your real numbers</text><rect x="30" y="178" width="215" height="70" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="137.5" y="208.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">/compact</text><text x="137.5" y="227.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">summarise history, keep the thread</text><rect x="272" y="178" width="215" height="70" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="379.5" y="208.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">/clear</text><text x="379.5" y="227.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">start fresh for a new task</text><rect x="514" y="178" width="216" height="70" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="622.0" y="208.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Auto-compact</text><text x="622.0" y="227.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">triggers near the limit</text></svg>
<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a permission decision is made"><title>How a permission decision is made</title><desc>A tool call is checked against deny rules, then allow rules, then the user is asked</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="20" y="130" width="150" height="60" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="95.0" y="155.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Claude wants to</text><text x="95.0" y="174.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">run a tool</text><rect x="215" y="130" width="140" height="60" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="285.0" y="155.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Deny rule?</text><text x="285.0" y="174.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">settings.json</text><rect x="400" y="130" width="140" height="60" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="470.0" y="155.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Allow rule?</text><text x="470.0" y="174.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">settings.json</text><rect x="585" y="130" width="155" height="60" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="662.5" y="155.625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Ask you</text><text x="662.5" y="173.125" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.0" font-weight="500" fill="var(--cu-muted)" opacity="1">1 yes · 2 always · 3 no</text><path d="M170,160 L211,160" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M355,160 L396,160" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><text x="376" y="150" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">no</text><path d="M540,160 L581,160" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><text x="561" y="150" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">no</text><rect x="215" y="38" width="140" height="50" rx="12" fill="#E5484D" fill-opacity="0.12" stroke="#E5484D" stroke-width="1.6"/><text x="285.0" y="58.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Blocked</text><text x="285.0" y="77.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">never runs</text><path d="M285,130 L285,92" fill="none" stroke="#E5484D" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-red)"/><text x="300" y="114" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">yes</text><rect x="400" y="250" width="140" height="50" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="470.0" y="279.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Runs silently</text><path d="M470,190 L470,246" fill="none" stroke="var(--cu-teal)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-teal)"/><text x="486" y="224" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">yes</text><rect x="585" y="250" width="155" height="50" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="662.5" y="279.725" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Runs once / saved</text><path d="M662,190 L662,246" fill="none" stroke="var(--cu-purple)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-purple)"/><text x="20" y="290" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--cu-muted)" opacity="1">Deny always wins over allow.</text></svg>
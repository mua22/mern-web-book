<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="From idea to a ready project"><title>From idea to a ready project</title><desc>Scope, requirements, MVP, stack, plan and setup</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="16" y="60.0" width="88" height="120" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="60.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Idea</text><rect x="122" y="63.0" width="88" height="114" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="166.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Scope</text><path d="M106,120 L120,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="228" y="66.0" width="88" height="108" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="272.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Requirements</text><path d="M212,120 L226,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="334" y="69.0" width="88" height="102" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="378.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">MVP</text><path d="M318,120 L332,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="440" y="72.0" width="88" height="96" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="484.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Tech stack</text><path d="M424,120 L438,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="546" y="75.0" width="88" height="90" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="590.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Plan</text><path d="M530,120 L544,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="652" y="78.0" width="88" height="84" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="696.0" y="124.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Set up</text><path d="M636,120 L650,120" fill="none" stroke="var(--cu-faint)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#h-plain)"/><text x="16" y="36" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-muted)" opacity="1">Each step narrows the problem. Ask Claude to interview you at every one.</text><rect x="16" y="205" width="728" height="56" rx="16" fill="var(--cu-teal)" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="16" y="205" width="728" height="56" rx="16" fill="none" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="30" y="225" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-teal)" opacity="1">CLAUDE&#x27;S ROLE</text><text x="380" y="241" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-text)" opacity="1">asks questions  ·  proposes options with trade-offs  ·  writes the plan to a file you can edit</text></svg>
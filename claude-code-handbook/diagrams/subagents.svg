<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subagents"><title>Subagents</title><desc>The main agent delegates to specialists that work in isolated contexts</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="280" y="20" width="200" height="64" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="380.0" y="47.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Main conversation</text><text x="380.0" y="66.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">your context stays small</text><rect x="26" y="138" width="218" height="130" rx="16" fill="var(--cu-purple)" stroke="var(--cu-purple)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="26" y="138" width="218" height="130" rx="16" fill="none" stroke="var(--cu-purple)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="40" y="158" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-purple)" opacity="1">OWN CONTEXT</text><rect x="40" y="168" width="190" height="62" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="135.0" y="194.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">explorer</text><text x="135.0" y="213.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">maps the code</text><path d="M380,84 L380,112 L135,112 L135,134" fill="none" stroke="var(--cu-faint)" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="266" y="138" width="218" height="130" rx="16" fill="var(--cu-orange)" stroke="var(--cu-orange)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="266" y="138" width="218" height="130" rx="16" fill="none" stroke="var(--cu-orange)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="280" y="158" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-orange)" opacity="1">OWN CONTEXT</text><rect x="280" y="168" width="190" height="62" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="375.0" y="194.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">tester</text><text x="375.0" y="213.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">writes + runs tests</text><path d="M380,84 L380,112 L375,112 L375,134" fill="none" stroke="var(--cu-faint)" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="506" y="138" width="218" height="130" rx="16" fill="var(--cu-teal)" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="506" y="138" width="218" height="130" rx="16" fill="none" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="520" y="158" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-teal)" opacity="1">OWN CONTEXT</text><rect x="520" y="168" width="190" height="62" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="615.0" y="194.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">reviewer</text><text x="615.0" y="213.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">reads the diff</text><path d="M380,84 L380,112 L615,112 L615,134" fill="none" stroke="var(--cu-faint)" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-plain)"/><text x="380" y="304" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-muted)" opacity="1">Each returns only a summary, so long searches never clutter your main context.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
    <rect width="600" height="250" rx="8" fill="#0f172a" />
    
    <!-- Code text -->
    <g font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold">
        <text x="70" y="110" fill="#6366f1">h1</text> <!-- Selector -->
        <text x="110" y="110" fill="#cbd5e1">{</text>
        <text x="140" y="110" fill="#38bdf8">color</text> <!-- Property 1 -->
        <text x="220" y="110" fill="#cbd5e1">:</text>
        <text x="240" y="110" fill="#34d399">blue</text> <!-- Value 1 -->
        <text x="300" y="110" fill="#cbd5e1">;</text>
        
        <text x="140" y="150" fill="#38bdf8">font-size</text> <!-- Property 2 -->
        <text x="290" y="150" fill="#cbd5e1">:</text>
        <text x="310" y="150" fill="#fb923c">24px</text> <!-- Value 2 -->
        <text x="380" y="150" fill="#cbd5e1">;</text>
        <text x="70" y="190" fill="#cbd5e1">}</text>
    </g>
    
    <!-- Labeled Elements with Lines/Pointers -->
    <g font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
        <!-- Selector pointer -->
        <line x1="85" y1="85" x2="85" y2="45" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" />
        <rect x="50" y="20" width="70" height="25" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
        <text x="60" y="36" fill="#818cf8" font-weight="bold">Selector</text>
        
        <!-- Declaration Block outline -->
        <rect x="125" y="80" width="295" height="115" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
        <line x1="272" y1="80" x2="272" y2="45" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
        <rect x="200" y="20" width="144" height="25" rx="4" fill="#475569" fill-opacity="0.4" stroke="#94a3b8" stroke-width="1" />
        <text x="212" y="36" fill="#cbd5e1" font-weight="bold">Declaration Block</text>
        
        <!-- Property label (pointing to color) -->
        <path d="M 170,115 L 170,225 L 200,225" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
        <rect x="205" y="212" width="70" height="25" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
        <text x="215" y="228" fill="#38bdf8" font-weight="bold">Property</text>
        
        <!-- Value label (pointing to blue) -->
        <path d="M 270,115 L 270,225 L 300,225" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" />
        <rect x="305" y="212" width="60" height="25" rx="4" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
        <text x="317" y="228" fill="#34d399" font-weight="bold">Value</text>
    </g>
</svg>

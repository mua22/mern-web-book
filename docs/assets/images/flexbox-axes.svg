<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
    <rect width="600" height="300" rx="8" fill="#0f172a" />
    
    <!-- Flex Container (Outline) -->
    <rect x="50" y="70" width="400" height="180" rx="6" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4,4" />
    <text x="60" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">FLEX CONTAINER (display: flex)</text>
    
    <!-- Flex Items inside the container -->
    <!-- Item 1 -->
    <rect x="80" y="110" width="90" height="100" rx="4" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
    <text x="100" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Item 1</text>
    
    <!-- Item 2 -->
    <rect x="190" y="110" width="110" height="100" rx="4" fill="#10b981" stroke="#34d399" stroke-width="1.5" />
    <text x="220" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Item 2</text>
    
    <!-- Item 3 -->
    <rect x="320" y="110" width="90" height="100" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="340" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Item 3</text>
    
    <!-- Axes and Labels -->
    <g font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
        <!-- Main Axis (Horizontal Arrow) -->
        <line x1="30" y1="40" x2="520" y2="40" stroke="#34d399" stroke-width="3" />
        <polygon points="520,40 510,35 510,45" fill="#34d399" />
        <text x="210" y="32" fill="#34d399">MAIN AXIS (flex-direction: row)</text>
        
        <!-- Cross Axis (Vertical Arrow) -->
        <line x1="520" y1="60" x2="520" y2="260" stroke="#fb923c" stroke-width="3" />
        <polygon points="520,260 515,250 525,250" fill="#fb923c" />
        <text x="535" y="160" fill="#fb923c" transform="rotate(90 535 160)">CROSS AXIS</text>
    </g>
</svg>

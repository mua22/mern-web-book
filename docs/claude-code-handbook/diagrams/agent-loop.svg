<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The agent loop"><title>The agent loop</title><desc>A coding agent gathers context, acts, verifies, and repeats until the goal is met</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="20" y="100" width="130" height="70" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="85.0" y="130.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Your goal</text><text x="85.0" y="149.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">plain English</text><rect x="190" y="100" width="150" height="70" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="265.0" y="130.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">1 · Gather</text><text x="265.0" y="149.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">read, search, ask</text><rect x="380" y="100" width="150" height="70" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="455.0" y="130.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">2 · Act</text><text x="455.0" y="149.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">edit files, run</text><rect x="570" y="100" width="150" height="70" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="645.0" y="130.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">3 · Verify</text><text x="645.0" y="149.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">tests, lint, build</text><path d="M150,135 L186,135" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M340,135 L376,135" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M530,135 L566,135" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M645,100 L645,52 L265,52 L265,96" fill="none" stroke="var(--cu-orange)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-orange)" stroke-dasharray="6 4"/><text x="455" y="44" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">not done yet → loop again</text><rect x="570" y="228" width="150" height="56" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="645.0" y="251.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Report back</text><text x="645.0" y="270.15000000000003" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">summary of changes</text><path d="M645,170 L645,224" fill="none" stroke="var(--cu-teal)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-teal)"/><text x="668" y="202" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">done</text><text x="190" y="214" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-faint)" opacity="1">TOOLS THE AGENT CALLS</text><rect x="190" y="224" width="62" height="24" rx="12.0" fill="var(--cu-faint)" fill-opacity="0.14" stroke="var(--cu-faint)" stroke-width="1"/><text x="221.0" y="240.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Read</text><rect x="260" y="224" width="62" height="24" rx="12.0" fill="var(--cu-faint)" fill-opacity="0.14" stroke="var(--cu-faint)" stroke-width="1"/><text x="291.0" y="240.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Grep</text><rect x="330" y="224" width="62" height="24" rx="12.0" fill="var(--cu-faint)" fill-opacity="0.14" stroke="var(--cu-faint)" stroke-width="1"/><text x="361.0" y="240.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Edit</text><rect x="400" y="224" width="62" height="24" rx="12.0" fill="var(--cu-faint)" fill-opacity="0.14" stroke="var(--cu-faint)" stroke-width="1"/><text x="431.0" y="240.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Bash</text><rect x="470" y="224" width="62" height="24" rx="12.0" fill="var(--cu-faint)" fill-opacity="0.14" stroke="var(--cu-faint)" stroke-width="1"/><text x="501.0" y="240.025" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="var(--cu-text)" opacity="1">Git</text><text x="190" y="268" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="var(--cu-muted)" opacity="1">You stay in control: risky tool calls ask first.</text></svg>
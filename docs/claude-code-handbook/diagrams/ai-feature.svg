<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adding an LLM feature safely"><title>Adding an LLM feature safely</title><desc>Prompt in, validate the output, fall back when the model is unavailable</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="20" y="110" width="120" height="64" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="80.0" y="137.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Your code</text><text x="80.0" y="156.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">needs a summary</text><rect x="180" y="110" width="140" height="64" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="250.0" y="137.3" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">ai.js</text><text x="250.0" y="156.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">builds the prompt</text><rect x="360" y="110" width="130" height="64" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="425.0" y="137.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Claude API</text><text x="425.0" y="156.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">Messages call</text><rect x="530" y="110" width="130" height="64" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="595.0" y="137.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Validate</text><text x="595.0" y="156.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">shape, length, safety</text><rect x="690" y="120" width="56" height="44" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="718.0" y="146.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">UI</text><path d="M140,142 L176,142" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M320,142 L356,142" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M490,142 L526,142" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M660,142 L686,142" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M595,174 L595,236 L250,236 L250,178" fill="none" stroke="var(--cu-orange)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-orange)" stroke-dasharray="5 4"/><text x="420" y="228" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">bad output or API error → safe fallback + log</text><text x="20" y="40" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--cu-muted)" opacity="1">Treat model output as untrusted input: validate it exactly like user input.</text><text x="20" y="270" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="var(--cu-muted)" opacity="1">Inject the client (ai.js takes a function) so tests never call the network.</text></svg>
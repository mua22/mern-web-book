<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Background jobs with retries"><title>Background jobs with retries</title><desc>Requests enqueue work; a worker retries with backoff and finally parks failures</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="20" y="100" width="120" height="60" rx="12" fill="var(--cu-faint)" fill-opacity="0.12" stroke="var(--cu-faint)" stroke-width="1.6"/><text x="80.0" y="125.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Request</text><text x="80.0" y="144.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">returns 202 fast</text><rect x="180" y="100" width="120" height="60" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="240.0" y="125.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Queue</text><text x="240.0" y="144.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">jobs wait here</text><rect x="340" y="100" width="120" height="60" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="400.0" y="125.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Worker</text><text x="400.0" y="144.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">runs one job</text><rect x="520" y="40" width="130" height="56" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="585.0" y="63.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Success</text><text x="585.0" y="82.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">mark done</text><rect x="520" y="168" width="130" height="56" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="585.0" y="191.3" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="var(--cu-text)" opacity="1">Failure</text><text x="585.0" y="210.15" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.0" font-weight="500" fill="var(--cu-muted)" opacity="1">attempts &lt; max?</text><rect x="520" y="244" width="130" height="38" rx="12" fill="#E5484D" fill-opacity="0.12" stroke="#E5484D" stroke-width="1.6"/><text x="585.0" y="267.2" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="var(--cu-text)" opacity="1">Dead letter</text><path d="M140,130 L176,130" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M300,130 L336,130" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><path d="M460,118 L516,76" fill="none" stroke="var(--cu-teal)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-teal)"/><path d="M460,142 L516,190" fill="none" stroke="var(--cu-orange)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-orange)"/><path d="M520,206 L390,206 L260,206 L240,164" fill="none" stroke="var(--cu-orange)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-orange)" stroke-dasharray="5 4"/><text x="392" y="198" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">retry after backoff</text><path d="M585,224 L585,242" fill="none" stroke="#E5484D" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-red)"/><text x="606" y="238" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="var(--cu-muted)" opacity="1">no</text><text x="662" y="72" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="var(--cu-muted)" opacity="1">result saved</text></svg>
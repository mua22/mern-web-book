<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What Claude loads, and when"><title>What Claude loads, and when</title><desc>Memory and tools load every session; skills and files load on demand; subagents are isolated</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="18" y="16" width="230" height="268" rx="16" fill="var(--cu-teal)" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="18" y="16" width="230" height="268" rx="16" fill="none" stroke="var(--cu-teal)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="32" y="36" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-teal)" opacity="1">ALWAYS LOADED</text><rect x="34" y="46" width="198" height="46" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="133.0" y="73.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">System prompt</text><rect x="34" y="104" width="198" height="46" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="133.0" y="131.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Tool definitions</text><rect x="34" y="162" width="198" height="46" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="133.0" y="189.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">CLAUDE.md memory</text><rect x="34" y="220" width="198" height="46" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="133.0" y="247.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">MCP tool names</text><rect x="264" y="16" width="230" height="268" rx="16" fill="var(--cu-purple)" stroke="var(--cu-purple)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.07"/><rect x="264" y="16" width="230" height="268" rx="16" fill="none" stroke="var(--cu-purple)" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.7"/><text x="278" y="36" text-anchor="start" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="800" fill="var(--cu-purple)" opacity="1">LOADED ON DEMAND</text><rect x="280" y="46" width="198" height="46" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="379.0" y="73.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Skill body (when relevant)</text><rect x="280" y="104" width="198" height="46" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(-
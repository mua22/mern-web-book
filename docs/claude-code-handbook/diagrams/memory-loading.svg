t-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Its own tools</text><rect x="526" y="162" width="198" height="46" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="625.0" y="189.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Returns a summary only</text><rect x="526" y="220" width="198" height="46" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="625.0" y="247.375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="var(--cu-text)" opacity="1">Your chat stays small</text></svg>
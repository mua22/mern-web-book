<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a good prompt"><title>Anatomy of a good prompt</title><desc>Goal, context, constraints and a definition of done</desc><defs><marker id="h-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-teal)"/></marker><marker id="h-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-purple)"/></marker><marker id="h-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-orange)"/></marker><marker id="h-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cu-faint)"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/></marker></defs><rect x="20" y="20" width="230" height="52" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="135.0" y="41.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Goal</text><text x="135.0" y="59.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">what outcome you want</text><path d="M250,46 L290,46" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="294" y="20" width="446" height="52" rx="12" fill="var(--cu-bg)" stroke="var(--cu-border-soft)" stroke-width="1.5" opacity="1"/><text x="312" y="51" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="var(--cu-text)" opacity="1">Add a stats endpoint</text><rect x="20" y="86" width="230" height="52" rx="12" fill="var(--cu-purple)" fill-opacity="0.12" stroke="var(--cu-purple)" stroke-width="1.6"/><text x="135.0" y="107.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Context</text><text x="135.0" y="125.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">where to look, what exists</text><path d="M250,112 L290,112" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="294" y="86" width="446" height="52" rx="12" fill="var(--cu-bg)" stroke="var(--cu-border-soft)" stroke-width="1.5" opacity="1"/><text x="312" y="117" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="var(--cu-text)" opacity="1">@src/store.js already has list()</text><rect x="20" y="152" width="230" height="52" rx="12" fill="var(--cu-orange)" fill-opacity="0.12" stroke="var(--cu-orange)" stroke-width="1.6"/><text x="135.0" y="173.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Constraints</text><text x="135.0" y="191.63750000000002" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">rules to respect</text><path d="M250,178 L290,178" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="294" y="152" width="446" height="52" rx="12" fill="var(--cu-bg)" stroke="var(--cu-border-soft)" stroke-width="1.5" opacity="1"/><text x="312" y="183" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="var(--cu-text)" opacity="1">no new dependencies</text><rect x="20" y="218" width="230" height="52" rx="12" fill="var(--cu-teal)" fill-opacity="0.12" stroke="var(--cu-teal)" stroke-width="1.6"/><text x="135.0" y="239.4625" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="var(--cu-text)" opacity="1">Done when</text><text x="135.0" y="257.6375" text-anchor="middle" font-family="Sora, 'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--cu-muted)" opacity="1">how to verify</text><path d="M250,244 L290,244" fill="none" stroke="var(--cu-faint)" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-plain)"/><rect x="294" y="218" width="446" height="52" rx="12" fill="var(--cu-bg)" stroke="var(--cu-border-soft)" stroke-width="1.5" opacity="1"/><text x="312" y="249" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="var(--cu-text)" opacity="1">npm test passes + new test</text></svg>
site_name: Web Dev Book — CSC336 & CSC337
site_description: >-
  An online textbook for Web Technologies (CSC336) and Advanced Web Technologies (CSC337),
  built lecture-by-lecture from the official COMSATS course plans.
site_author: Usman Akram
site_url: https://mua22.github.io/mern-web-book/
copyright: Copyright &copy; Usman Akram — <a href="https://usmanlive.com">usmanlive.com</a>

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    admonition:
      note: material/lightbulb-on-outline
      tip: material/school-outline
      warning: material/alert-outline
      example: material/code-braces-box
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mua22/mern-web-book
    - icon: fontawesome/solid/globe
      link: https://usmanlive.com
  version:
    provider: mike
    default: latest

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true
  - tags

nav:
  - Home:
      - index.md
      - Downloads: downloads.md
      - Demos: demos.md
  - Web Technologies (CSC336):
      - Overview: web-technologies/index.md
      - "Unit 1 — Foundations of the Web":
          - "1. Introduction to Web Development": web-technologies/lecture-01-introduction-to-web-development.md
          - "2. Tiered Web Architecture": web-technologies/lecture-02-tiered-web-architecture.md
      - "Unit 2 — Markup Languages":
          - "3. HTML and HTML5 Fundamentals": web-technologies/lecture-03-html-html5-fundamentals.md
          - "4. Semantic HTML and Forms": web-technologies/lecture-04-semantic-html-and-forms.md
      - "Unit 3 — Styling with CSS":
          - "5. CSS Fundamentals": web-technologies/lecture-05-css-fundamentals.md
          - "6. The CSS Box Model and Display": web-technologies/lecture-06-css-box-model-and-display.md
          - "7. CSS Positioning and Stacking": web-technologies/lecture-07-css-positioning-and-stacking.md
          - "8. CSS3 Features": web-technologies/lecture-08-css3-features.md
          - "9. Flexbox and Grid Layout": web-technologies/lecture-09-flexbox-and-grid-layout.md
          - "10. Responsive Design and Frameworks": web-technologies/lecture-10-responsive-design-and-frameworks.md
      - "Unit 4 — Modern JavaScript (ES6+)":
          - "11. Core JavaScript (ES6+)": web-technologies/lecture-11-core-javascript-es6.md
          - "12. Array Methods and Processing": web-technologies/lecture-12-array-methods-and-processing.md
          - "13. DOM Manipulation and Events": web-technologies/lecture-13-dom-manipulation-and-events.md
          - "14. Regular Expressions and JSON": web-technologies/lecture-14-regular-expressions-and-json.md
          - "15. Async JavaScript, Promises and Fetch": web-technologies/lecture-15-async-javascript-promises-fetch.md
      - "Unit 5 — Server-Side Development":
          - "16. Introduction to Server-Side Programming": web-technologies/lecture-16-introduction-to-server-side-programming.md
          - "17. Midterm Review": web-technologies/lecture-17-midterm-review.md
          - "18. Request Handling and Routing": web-technologies/lecture-18-request-handling-and-routing.md
          - "19. HTTP Status Codes and Headers": web-technologies/lecture-19-http-status-codes-and-headers.md
          - "20. Cookies and Sessions": web-technologies/lecture-20-cookies-and-sessions.md
          - "21. Middleware": web-technologies/lecture-21-middleware.md
          - "22. Database Connectivity: PostgreSQL / MongoDB": web-technologies/lecture-22-database-connectivity-postgresql-mongodb.md
          - "23. Object-Relational Mapping": web-technologies/lecture-23-object-relational-mapping.md
          - "24. Response Generation with Templates": web-technologies/lecture-24-response-generation-with-templates.md
          - "25. REST API Development and Authentication": web-technologies/lecture-25-rest-api-development-and-authentication.md
      - "Unit 6 — Front-End Development with React":
          - "26. Introduction to React.js": web-technologies/lecture-26-introduction-to-react.md
          - "27. Components, Props and Events": web-technologies/lecture-27-components-props-and-events.md
          - "28. Hooks and State Management": web-technologies/lecture-28-hooks-and-state-management.md
          - "29. Routing and API Integration": web-technologies/lecture-29-routing-and-api-integration.md
      - "Unit 7 — Security and Deployment":
          - "30. Application Security Basics": web-technologies/lecture-30-application-security-basics.md
          - "31. Common Web Attacks and Defenses": web-technologies/lecture-31-common-web-attacks-and-defenses.md
          - "32. Domain, DNS and Deployment": web-technologies/lecture-32-domain-dns-and-deployment.md
  - Advanced Web Technologies (CSC337):
      - Overview: advanced-web-technologies/index.md
      - "Unit 1 — Enterprise Architecture Foundations":
          - "1. Course Overview and Enterprise Architecture": advanced-web-technologies/lecture-01-course-overview-and-enterprise-architecture.md
          - "2. Technology Selection and Cross-Cutting Concerns": advanced-web-technologies/lecture-02-technology-selection-and-cross-cutting-concerns.md
      - "Unit 2 — Full-Stack Architecture Layers":
          - "3. Business, Infrastructure and Application Layers": advanced-web-technologies/lecture-03-business-infrastructure-application-layers.md
          - "4. Data Layer and Microservices": advanced-web-technologies/lecture-04-data-layer-and-microservices.md
      - "Unit 3 — API Design and Real-Time Communication":
          - "5. Professional API Design": advanced-web-technologies/lecture-05-professional-api-design.md
          - "6. REST and GraphQL": advanced-web-technologies/lecture-06-rest-and-graphql.md
          - "7. JSON-RPC and WebSockets": advanced-web-technologies/lecture-07-json-rpc-and-websockets.md
          - "8. Selecting a Communication Approach": advanced-web-technologies/lecture-08-selecting-a-communication-approach.md
      - "Unit 4 — Web and API Security":

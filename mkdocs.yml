          - "10. OAuth 2.0 and OpenID Connect": advanced-web-technologies/lecture-10-oauth2-and-openid-connect.md
          - "11. Web-Specific Security": advanced-web-technologies/lecture-11-web-specific-security.md
          - "12. API Security": advanced-web-technologies/lecture-12-api-security.md
          - "13. OWASP Top 10": advanced-web-technologies/lecture-13-owasp-top-10.md
      - "Unit 5 — Performance, Caching and Scalability":
          - "14. Frontend Performance": advanced-web-technologies/lecture-14-frontend-performance.md
          - "15. Web and Server Caching": advanced-web-technologies/lecture-15-web-and-server-caching.md
          - "16. Application Caching with Redis": advanced-web-technologies/lecture-16-application-caching-with-redis.md
          - "17. Midterm Review": advanced-web-technologies/lecture-17-midterm-review.md
          - "18. Database Monitoring and Optimization": advanced-web-technologies/lecture-18-database-monitoring-and-optimization.md
          - "19. Event-Driven Scalability: Kafka and Multi-Tenant SaaS": advanced-web-technologies/lecture-19-event-driven-scalability-kafka-and-saas.md
      - "Unit 6 — Production Frontend with Next.js":
          - "20. Next.js Architecture and Setup": advanced-web-technologies/lecture-20-nextjs-architecture-and-setup.md
          - "21. Routing and Layout Management": advanced-web-technologies/lecture-21-routing-and-layout-management.md
          - "22. Rendering Strategies and Server Capabilities": advanced-web-technologies/lecture-22-rendering-strategies-and-server-capabilities.md
          - "23. Components, Layouts and Styling": advanced-web-technologies/lecture-23-components-layouts-and-styling.md
          - "24. Frontend Architecture": advanced-web-technologies/lecture-24-frontend-architecture.md
          - "25. Data Fetching with TanStack Query": advanced-web-technologies/lecture-25-data-fetching-with-tanstack-query.md
          - "26. Authentication and Security in Next.js": advanced-web-technologies/lecture-26-authentication-and-security-in-nextjs.md
          - "27. Performance Optimization and Testing": advanced-web-technologies/lecture-27-performance-optimization-and-testing.md
          - "28. Deploying on Vercel": advanced-web-technologies/lecture-28-deploying-on-vercel.md
      - "Unit 7 — Testing, Reliability and Monitoring":
          - "29. Web Application and API Testing": advanced-web-technologies/lecture-29-web-application-and-api-testing.md
          - "30. Reliability and Observability: Log Levels": advanced-web-technologies/lecture-30-reliability-and-observability-log-levels.md
          - "31. Application and Server Monitoring": advanced-web-technologies/lecture-31-application-and-server-monitoring.md
          - "32. Course Review": advanced-web-technologies/lecture-32-course-review.md
  - Tutorials:
      - tutorials/index.md
      - Git and GitHub: tutorials/git-and-github.md
  - Tags: tags.md
  - usmanlive.com: https://usmanlive.com

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.smartsymbols
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys

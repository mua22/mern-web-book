site_name: MERN Web Technologies
theme:
  name: material
nav:
  - Home: index.md
  - Web Foundations:
      - Overview: 01-web-foundations/overview.md
      - Web Architectures: 01-web-foundations/web-architectures.md
      - Technology Overview: 01-web-foundations/technology-overview.md
      - HTML/CSS: 01-web-foundations/html_css_chapter.md
      - Git/Github: 01-web-foundations/github-demo.md
  - HTML & CSS:
      - Fundamentals: 02-html/index.md
  - JavaScript: 
      - JS Introduction: 03-javascript/index.md
      - JS Basics: 03-javascript/01-javascript-basics.md
      - DOM Manipulation: 03-javascript/02-dom-manipulation.md
      - Event Handling: 03-javascript/03-event-handling.md
      - Async JavaScript: 03-javascript/04-asynchronous-javascript.md
  - Node.js & Express: 04-node/index.md
  - Demos: demos/index.md
  - React: 05-react/index.md
  - Slides: slides/index.md
  - Blog: https://usmanlive.com
  - Sample Codes: https://github.com/mua22/merrn-web-book-demos
markdown_extensions:
  - fenced_code
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
    <rect width="600" height="350" rx="8" fill="#0f172a" />
    
    <!-- Concentric Boxes -->
    
    <!-- MARGIN Box (Light Orange Outer) -->
    <rect x="50" y="30" width="500" height="290" rx="6" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="60" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fdba74">MARGIN (Outer Space)</text>
    
    <!-- BORDER Box (Indigo/Blue Middle Outer) -->
    <rect x="90" y="70" width="420" height="210" rx="6" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="3" />
    <text x="100" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">BORDER</text>
    
    <!-- PADDING Box (Green Middle Inner) -->
    <rect x="130" y="110" width="340" height="130" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="140" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">PADDING (Inner Gap)</text>
    
    <!-- CONTENT Box (Indigo Inner) -->
    <rect x="180" y="150" width="240" height="50" rx="4" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
    <text x="270" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">CONTENT</text>
    
    <!-- Dimension indicators -->
    <g stroke="#94a3b8" stroke-width="1" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">
        <!-- Content Width line -->
        <line x1="180" y1="210" x2="420" y2="210" />
        <polygon points="180,210 185,207 185,213" />
        <polygon points="420,210 415,207 415,213" />
        <text x="280" y="225" fill="#cbd5e1">Width (240px)</text>
        
        <!-- Content Height line -->
        <line x1="435" y1="150" x2="435" y2="200" />
        <polygon points="435,150 432,155 438,155" />
        <polygon points="435,200 432,195 438,195" />
        <text x="445" y="180" fill="#cbd5e1">Height</text>
    </g>
</svg>
